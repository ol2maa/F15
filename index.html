<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bird Shooter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 500px;
            height: 700px;
            background: linear-gradient(180deg, #1a6fb5 0%, #4a9eff 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            touch-action: none;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: none;
        }
        
        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        
        #hud .hud-item {
            flex: 1;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
        }
        
        #hud .hud-item.score { color: #fff; }
        #hud .hud-item.bullets { color: #ffd700; }
        #hud .hud-item.bullets.low { color: #ff4444; }
        #hud .hud-item.speed { color: #00ffff; }
        #hud .hud-item.wave { color: #90ee90; }
        
        #hud .hud-item .icon {
            margin-right: 3px;
        }
        
        /* Game Over */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }
        
        #gameOverScreen.show {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        #gameOverScreen .title {
            font-size: 48px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        #gameOverScreen .final-score {
            font-size: 28px;
            color: #ffd700;
            margin: 15px 0;
            font-weight: bold;
        }
        
        #gameOverScreen .final-wave {
            font-size: 18px;
            color: #90ee90;
            margin-bottom: 25px;
        }
        
        #gameOverScreen .restart-btn {
            padding: 16px 50px;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 200, 80, 0.3);
            touch-action: manipulation;
        }
        
        #gameOverScreen .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0, 200, 80, 0.5);
        }
        
        #gameOverScreen .restart-btn:active {
            transform: scale(0.95);
        }
        
        #gameOverScreen .reason {
            font-size: 16px;
            color: #ff6b6b;
            margin-bottom: 20px;
            padding: 8px 20px;
            background: rgba(255, 0, 0, 0.15);
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        
        /* أزرار التحكم */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 5;
            padding: 0 10px;
            touch-action: none;
        }
        
        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.85);
            color: #1a1a2e;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            -webkit-touch-callout: none;
        }
        
        .ctrl-btn:active {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 1);
        }
        
        .ctrl-btn.pressed {
            transform: scale(0.88);
            background: rgba(255, 255, 255, 1);
        }
        
        .ctrl-btn.fire-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff4444, #ff6b6b);
            color: white;
            font-size: 28px;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
        }
        
        .ctrl-btn.fire-btn:active {
            background: linear-gradient(135deg, #cc0000, #ff3333);
        }
        
        .ctrl-btn.fire-btn.pressed {
            background: linear-gradient(135deg, #cc0000, #ff3333);
        }
        
        .ctrl-grid {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(3, 48px);
            gap: 4px;
            touch-action: none;
        }
        
        .ctrl-grid .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            font-size: 18px;
        }
        
        @media (max-width: 520px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .ctrl-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .ctrl-btn.fire-btn {
                width: 54px;
                height: 54px;
                font-size: 24px;
            }
            .ctrl-grid {
                grid-template-columns: repeat(3, 42px);
                grid-template-rows: repeat(3, 42px);
                gap: 3px;
            }
            .ctrl-grid .ctrl-btn {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
            #hud {
                font-size: 12px;
                height: 35px;
                padding: 0 6px;
            }
            #hud .hud-item {
                font-size: 11px;
            }
            #gameOverScreen .title {
                font-size: 36px;
            }
        }
        
        @media (max-width: 380px) {
            .ctrl-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .ctrl-btn.fire-btn {
                width: 46px;
                height: 46px;
                font-size: 20px;
            }
            .ctrl-grid {
                grid-template-columns: repeat(3, 36px);
                grid-template-rows: repeat(3, 36px);
                gap: 2px;
            }
            .ctrl-grid .ctrl-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            #hud {
                font-size: 10px;
                height: 30px;
                padding: 0 4px;
            }
            #hud .hud-item {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="500" height="700"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div class="hud-item score">🏆 <span id="scoreDisplay">0</span></div>
            <div class="hud-item bullets" id="bulletsDisplay">🔫 <span id="bulletsCount">30</span>/<span id="maxBullets">30</span></div>
            <div class="hud-item speed">⚡ <span id="speedDisplay">0.0</span></div>
            <div class="hud-item wave">🌊 <span id="waveDisplay">1</span></div>
        </div>
        
        <!-- Game Over -->
        <div id="gameOverScreen">
            <div class="title">💥 GAME OVER</div>
            <div class="reason" id="reasonText">💀 No bullets left!</div>
            <div class="final-score">🏆 Score: <span id="finalScore">0</span></div>
            <div class="final-wave">🌊 Wave: <span id="finalWave">1</span></div>
            <button class="restart-btn" id="restartBtn">🔄 إعادة اللعبة</button>
        </div>
        
        <!-- أزرار التحكم -->
        <div id="controls">
            <div class="ctrl-grid">
                <button class="ctrl-btn" data-dir="up-left">↖</button>
                <button class="ctrl-btn" data-dir="up">↑</button>
                <button class="ctrl-btn" data-dir="up-right">↗</button>
                <button class="ctrl-btn" data-dir="left">←</button>
                <button class="ctrl-btn fire-btn" id="fireBtn">🔥</button>
                <button class="ctrl-btn" data-dir="right">→</button>
                <button class="ctrl-btn" data-dir="down-left">↙</button>
                <button class="ctrl-btn" data-dir="down">↓</button>
                <button class="ctrl-btn" data-dir="down-right">↘</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ===== إعدادات اللعبة =====
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // عناصر HUD
            const scoreDisplay = document.getElementById('scoreDisplay');
            const bulletsCount = document.getElementById('bulletsCount');
            const maxBulletsDisplay = document.getElementById('maxBullets');
            const bulletsDisplay = document.getElementById('bulletsDisplay');
            const speedDisplay = document.getElementById('speedDisplay');
            const waveDisplay = document.getElementById('waveDisplay');
            
            // عناصر Game Over
            const gameOverScreen = document.getElementById('gameOverScreen');
            const finalScore = document.getElementById('finalScore');
            const finalWave = document.getElementById('finalWave');
            const reasonText = document.getElementById('reasonText');
            const restartBtn = document.getElementById('restartBtn');
            
            // ===== متغيرات اللعبة =====
            const W = 500, H = 700;
            const BIRD_SIZE = 40;
            const ENEMY_SIZE = 50;
            const BULLET_SIZE = 14;
            const BULLET_RADIUS = BULLET_SIZE / 2;
            const BULLET_SPEED = 12;
            const MAX_BULLETS = 30;
            const BULLETS_ADDED = 15;
            
            let birdX = 200, birdY = 300;
            let direction = 0;
            let speed = 0;
            const BASE_SPEED = 2;
            const MAX_SPEED = 10;
            const SPEED_STEP = 2;
            
            let bullets = [];
            let bulletsRemaining = 30;
            
            let enemies = [];
            let enemySpeedMultiplier = 1.0;
            
            let score = 0;
            let enemiesSpawned = 0;
            let gameOver = false;
            let gameOverReason = '';
            
            // ===== متغيرات للأزرار =====
            let fireInterval = null;
            let dirIntervals = {};
            
            // ===== دوال الأعداء =====
            function createEnemies() {
                enemies = [];
                for (let i = 0; i < 3; i++) {
                    let x = 50 + Math.random() * 400;
                    let y = 50 + Math.random() * 400;
                    while (Math.abs(x - birdX) < 100 && Math.abs(y - birdY) < 100) {
                        x = 50 + Math.random() * 400;
                        y = 50 + Math.random() * 400;
                    }
                    const angle = Math.random() * 2 * Math.PI;
                    const spd = (2 + Math.random() * 2) * enemySpeedMultiplier;
                    const vx = spd * Math.cos(angle);
                    const vy = spd * Math.sin(angle);
                    enemies.push({ x, y, vx, vy, alive: true });
                }
                
                enemiesSpawned++;
                if (enemiesSpawned > 1) {
                    bulletsRemaining = Math.min(bulletsRemaining + BULLETS_ADDED, MAX_BULLETS);
                }
                updateHUD();
            }
            
            // ===== دوال الرسم =====
            function drawEnemies() {
                for (const e of enemies) {
                    if (!e.alive) continue;
                    ctx.fillStyle = '#7b2fbe';
                    ctx.fillRect(e.x, e.y, ENEMY_SIZE, ENEMY_SIZE);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(e.x, e.y, ENEMY_SIZE, ENEMY_SIZE);
                }
            }
            
            function drawBird() {
                const cx = birdX + BIRD_SIZE/2;
                const cy = birdY + BIRD_SIZE/2;
                const r = 20;
                const angle = direction;
                
                const p1x = cx + r * 1.5 * Math.cos(angle);
                const p1y = cy + r * 1.5 * Math.sin(angle);
                const p2x = cx - r * Math.cos(angle + Math.PI/3);
                const p2y = cy - r * Math.sin(angle + Math.PI/3);
                const p3x = cx - r * Math.cos(angle - Math.PI/3);
                const p3y = cy - r * Math.sin(angle - Math.PI/3);
                
                ctx.beginPath();
                ctx.moveTo(p1x, p1y);
                ctx.lineTo(p2x, p2y);
                ctx.lineTo(p3x, p3y);
                ctx.closePath();
                ctx.fillStyle = '#ffcc00';
                ctx.fill();
                ctx.strokeStyle = '#cc9900';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(p1x, p1y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff0000';
                ctx.fill();
            }
            
            function drawBullets() {
                for (const b of bullets) {
                    // توهج
                    const gradient = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, BULLET_SIZE);
                    gradient.addColorStop(0, 'rgba(255,255,255,0.8)');
                    gradient.addColorStop(0.5, 'rgba(255,255,255,0.4)');
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BULLET_SIZE, 0, 2 * Math.PI);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    // الرصاصة الأساسية
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BULLET_RADIUS, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(200,200,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, W, H);
                
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a6fb5');
                grad.addColorStop(1, '#4a9eff');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                
                drawEnemies();
                drawBird();
                drawBullets();
            }
            
            // ===== كشف التصادم بين الرصاصة والمربع =====
            function checkBulletCollision(bullet, enemy) {
                // أقرب نقطة في المربع إلى مركز الرصاصة
                const closestX = Math.max(enemy.x, Math.min(bullet.x, enemy.x + ENEMY_SIZE));
                const closestY = Math.max(enemy.y, Math.min(bullet.y, enemy.y + ENEMY_SIZE));
                
                // المسافة بين مركز الرصاصة وأقرب نقطة
                const dx = bullet.x - closestX;
                const dy = bullet.y - closestY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // إذا كانت المسافة أقل من نصف قطر الرصاصة، فهناك تصادم
                return distance < BULLET_RADIUS;
            }
            
            // ===== تحديث HUD =====
            function updateHUD() {
                scoreDisplay.textContent = score;
                bulletsCount.textContent = bulletsRemaining;
                maxBulletsDisplay.textContent = MAX_BULLETS;
                if (bulletsRemaining <= 5) {
                    bulletsDisplay.classList.add('low');
                } else {
                    bulletsDisplay.classList.remove('low');
                }
                speedDisplay.textContent = speed.toFixed(1);
                waveDisplay.textContent = enemiesSpawned || 1;
            }
            
            // ===== تحديث اللعبة =====
            function update() {
                if (gameOver) return;
                
                birdX += speed * Math.cos(direction);
                birdY += speed * Math.sin(direction);
                
                // تحريك الرصاص وكشف التصادم
                const newBullets = [];
                for (const b of bullets) {
                    b.x += b.vx;
                    b.y += b.vy;
                    
                    let hit = false;
                    for (const e of enemies) {
                        if (!e.alive) continue;
                        // استخدام دالة كشف التصادم المحسنة
                        if (checkBulletCollision(b, e)) {
                            e.alive = false;
                            score += 10;
                            hit = true;
                            break;
                        }
                    }
                    
                    if (!hit && b.x >= 0 && b.x <= W && b.y >= 0 && b.y <= H) {
                        newBullets.push(b);
                    }
                }
                bullets = newBullets;
                
                // تحديث الأعداء
                for (const e of enemies) {
                    if (!e.alive) continue;
                    e.x += e.vx;
                    e.y += e.vy;
                    
                    if (e.x <= 0 || e.x >= W - ENEMY_SIZE) {
                        e.vx = -e.vx;
                        e.x = Math.max(0, Math.min(W - ENEMY_SIZE, e.x));
                    }
                    if (e.y <= 0 || e.y >= H - ENEMY_SIZE) {
                        e.vy = -e.vy;
                        e.y = Math.max(0, Math.min(H - ENEMY_SIZE, e.y));
                    }
                    
                    // كشف تصادم الطائرة مع العدو (مربع مع مربع)
                    if (birdX + BIRD_SIZE > e.x && birdX < e.x + ENEMY_SIZE &&
                        birdY + BIRD_SIZE > e.y && birdY < e.y + ENEMY_SIZE) {
                        gameOver = true;
                        gameOverReason = '💥 Crash!';
                        showGameOver();
                        return;
                    }
                }
                
                // التحقق من تدمير جميع الأعداء
                const allDead = enemies.every(e => !e.alive);
                if (allDead && enemies.length > 0) {
                    enemySpeedMultiplier += 0.3;
                    createEnemies();
                }
                
                // اصطدام الطائرة بالحافة
                if (birdX <= 0 || birdX >= W - BIRD_SIZE ||
                    birdY <= 0 || birdY >= H - BIRD_SIZE) {
                    gameOver = true;
                    gameOverReason = '💥 Crash!';
                    showGameOver();
                    return;
                }
                
                if (bulletsRemaining <= 0) {
                    gameOver = true;
                    gameOverReason = '💀 No bullets left!';
                    showGameOver();
                    return;
                }
                
                updateHUD();
                draw();
            }
            
            // ===== عرض شاشة Game Over =====
            function showGameOver() {
                finalScore.textContent = score;
                finalWave.textContent = enemiesSpawned || 1;
                reasonText.textContent = gameOverReason;
                gameOverScreen.classList.add('show');
                updateHUD();
                clearAllIntervals();
            }
            
            // ===== إعادة اللعبة =====
            function restartGame() {
                gameOver = false;
                gameOverReason = '';
                gameOverScreen.classList.remove('show');
                
                birdX = 200;
                birdY = 300;
                direction = 0;
                speed = 0;
                
                bullets = [];
                bulletsRemaining = 30;
                
                enemies = [];
                enemySpeedMultiplier = 1.0;
                enemiesSpawned = 0;
                
                score = 0;
                
                createEnemies();
                updateHUD();
                draw();
            }
            
            // ===== إطلاق رصاصة =====
            function fireBullet() {
                if (gameOver) return;
                if (bulletsRemaining <= 0) return;
                
                const cx = birdX + BIRD_SIZE/2;
                const cy = birdY + BIRD_SIZE/2;
                const r = 20;
                
                const noseX = cx + r * 1.5 * Math.cos(direction);
                const noseY = cy + r * 1.5 * Math.sin(direction);
                
                const bvx = BULLET_SPEED * Math.cos(direction);
                const bvy = BULLET_SPEED * Math.sin(direction);
                
                bullets.push({ x: noseX, y: noseY, vx: bvx, vy: bvy });
                bulletsRemaining--;
                updateHUD();
            }
            
            // ===== التحكم في الاتجاه =====
            function handleDirection(newDirection) {
                if (gameOver) return;
                
                let diff = newDirection - direction;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                
                if (Math.abs(diff) < 0.01) {
                    speed = Math.min(speed + SPEED_STEP, MAX_SPEED);
                } else {
                    if (speed <= 0) {
                        speed = BASE_SPEED;
                    } else {
                        speed = Math.max(speed - SPEED_STEP, 0);
                        if (speed === 0) speed = BASE_SPEED;
                    }
                    direction = newDirection;
                }
                updateHUD();
            }
            
            // ===== إيقاف جميع المؤقتات =====
            function clearAllIntervals() {
                if (fireInterval) {
                    clearInterval(fireInterval);
                    fireInterval = null;
                }
                for (const key in dirIntervals) {
                    if (dirIntervals[key]) {
                        clearInterval(dirIntervals[key]);
                        delete dirIntervals[key];
                    }
                }
            }
            
            // ===== ربط الأزرار =====
            const dirMap = {
                'up': -Math.PI/2,
                'up-right': -Math.PI/4,
                'right': 0,
                'down-right': Math.PI/4,
                'down': Math.PI/2,
                'down-left': 3*Math.PI/4,
                'left': Math.PI,
                'up-left': -3*Math.PI/4
            };
            
            document.querySelectorAll('[data-dir]').forEach(btn => {
                const dir = btn.dataset.dir;
                const angle = dirMap[dir];
                
                const startPress = (e) => {
                    e.preventDefault();
                    if (gameOver) return;
                    btn.classList.add('pressed');
                    handleDirection(angle);
                    if (!dirIntervals[dir]) {
                        dirIntervals[dir] = setInterval(() => {
                            if (!gameOver) {
                                handleDirection(angle);
                            }
                        }, 150);
                    }
                };
                
                const endPress = (e) => {
                    e.preventDefault();
                    btn.classList.remove('pressed');
                    if (dirIntervals[dir]) {
                        clearInterval(dirIntervals[dir]);
                        delete dirIntervals[dir];
                    }
                };
                
                btn.addEventListener('touchstart', startPress);
                btn.addEventListener('touchend', endPress);
                btn.addEventListener('touchcancel', endPress);
                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', endPress);
                btn.addEventListener('mouseleave', endPress);
            });
            
            // زر الإطلاق
            const fireBtn = document.getElementById('fireBtn');
            
            const startFire = (e) => {
                e.preventDefault();
                if (gameOver) return;
                fireBtn.classList.add('pressed');
                fireBullet();
                if (!fireInterval) {
                    fireInterval = setInterval(() => {
                        if (!gameOver && bulletsRemaining > 0) {
                            fireBullet();
                        } else if (bulletsRemaining <= 0) {
                            clearInterval(fireInterval);
                            fireInterval = null;
                        }
                    }, 200);
                }
            };
            
            const endFire = (e) => {
                e.preventDefault();
                fireBtn.classList.remove('pressed');
                if (fireInterval) {
                    clearInterval(fireInterval);
                    fireInterval = null;
                }
            };
            
            fireBtn.addEventListener('touchstart', startFire);
            fireBtn.addEventListener('touchend', endFire);
            fireBtn.addEventListener('touchcancel', endFire);
            fireBtn.addEventListener('mousedown', startFire);
            fireBtn.addEventListener('mouseup', endFire);
            fireBtn.addEventListener('mouseleave', endFire);
            
            restartBtn.addEventListener('click', restartGame);
            restartBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                restartGame();
            });
            
            // ===== دورة اللعبة =====
            let lastTime = 0;
            const interval = 1000 / 20;
            
            function gameLoop(timestamp) {
                if (timestamp - lastTime >= interval) {
                    update();
                    lastTime = timestamp;
                }
                requestAnimationFrame(gameLoop);
            }
            
            // ===== بدء اللعبة =====
            createEnemies();
            updateHUD();
            draw();
            requestAnimationFrame(gameLoop);
            
            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#gameContainer')) {
                    e.preventDefault();
                }
            }, { passive: false });
            
        })();
    </script>
</body>
</html>
